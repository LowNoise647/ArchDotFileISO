[module]
id = "lnos-fonts"
version = "1.0.0"
name = "LNOS Fonts Module"
description = "Complete font collection"
license = "MIT"
author = "LNOS Team"

[dependencies]
modules = ["lnos-base"]
packages = [
    "ttf-jetbrains-mono",
    "ttf-nerd-fonts-symbols",
    "ttf-font-awesome",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "ttf-dejavu",
    "ttf-liberation",
    "ttf-roboto",
]

[arch]
supported = ["x86_64"]
