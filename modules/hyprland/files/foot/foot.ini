[main]
term=xterm-256color
font=JetBrains Mono:size=10
dpi-aware=yes

[scrollback]
lines=10000
indicator-position=relative

[colors]
background=1e1e2e
foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

[key-bindings]
search-start=ctrl+shift+f
font-increase=ctrl+plus
font-decrease=ctrl+minus

[mouse]
hide-when-typing=yes

[cursor]
style=beam
color=cdd6f4 1e1e2e
