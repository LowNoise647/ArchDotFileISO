#!/usr/sbin/nft -f

# LNOS Default nftables Firewall
# Section 38-39 of LNOS Specification

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif lo accept

        # Allow established/related connections
        ct state established,related accept

        # Allow ICMP (ping)
        ip protocol icmp accept
        ip6 protocol icmpv6 accept

        # Allow SSH (port 22)
        tcp dport 22 accept

        # Allow mDNS (Avahi)
        udp dport 5353 accept

        # Allow DHCP
        udp dport 67 accept
        udp dport 68 accept

        # Log dropped packets
        log prefix "nftables-drop: " limit rate 10/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table inet nat {
    chain postrouting {
        type nat hook postrouting priority 100;
    }

    chain prerouting {
        type nat hook prerouting priority 100;
    }
}
