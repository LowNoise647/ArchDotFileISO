name: Build LNOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust tools
        run: cargo build --release
      - name: Run tests
        run: cargo test
      - name: Check formatting
        run: cargo fmt --check
